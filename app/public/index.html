<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mini Shop</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
      li { margin: 0.25rem 0; }
      .error { color: #b00020; }
    </style>
  </head>
  <body>
    <h1>Mini Shop</h1>

    <section>
      <h2>Products</h2>
      <ul id="products"></ul>
    </section>

    <section>
      <h2>Cart</h2>
      <ul id="cart"></ul>
      <label><input type="checkbox" id="discount" /> Apply 10% discount</label>
      <p>Total: <strong id="total">0.00</strong> €</p>
    </section>

    <section>
      <h2>Stock</h2>
      <p id="inventory-status">Loading…</p>
      <ul id="inventory"></ul>
    </section>

    <section>
      <h2>Report</h2>
      <button id="load-report">Load report</button>
      <p id="report"></p>
    </section>

    <section>
      <h2>Contact</h2>
      <form id="contact">
        <input name="email" type="email" placeholder="email" required />
        <button type="submit">Send</button>
      </form>
      <p id="contact-result" role="status"></p>
    </section>

    <script>
      const cart = [];
      let products = [];

      function renderCart() {
        const ul = document.getElementById("cart");
        ul.innerHTML = "";
        cart.forEach((p, i) => {
          const li = document.createElement("li");
          li.textContent = p.name + " ";
          const btn = document.createElement("button");
          btn.textContent = "Remove";
          btn.setAttribute("aria-label", "Remove " + p.name);
          btn.onclick = () => { cart.splice(i, 1); renderCart(); };
          li.appendChild(btn);
          ul.appendChild(li);
        });

        let total = cart.reduce((sum, p) => sum + p.price, 0);
        if (document.getElementById("discount").checked) {
          total = total * 0.9;
          // DELIBERATE BUG: the discount is applied a second time.
          total = total * 0.9;
        }
        document.getElementById("total").textContent = total.toFixed(2);
      }

      fetch("/api/products").then((r) => r.json()).then((list) => {
        products = list;
        const ul = document.getElementById("products");
        list.forEach((p) => {
          const li = document.createElement("li");
          li.textContent = `${p.name} — ${p.price} € `;
          const btn = document.createElement("button");
          btn.textContent = "Add";
          btn.setAttribute("aria-label", "Add " + p.name);
          btn.onclick = () => { cart.push(p); renderCart(); };
          li.appendChild(btn);
          ul.appendChild(li);
        });
      });

      document.getElementById("discount").onchange = renderCart;

      fetch("/api/inventory").then(async (r) => {
        const status = document.getElementById("inventory-status");
        if (!r.ok) {
          status.textContent = "Failed to load stock (HTTP " + r.status + ")";
          status.className = "error";
          return;
        }
        const stock = await r.json();
        status.textContent = "Stock updated";
        const ul = document.getElementById("inventory");
        Object.entries(stock).forEach(([id, qty]) => {
          const li = document.createElement("li");
          li.dataset.productId = id;
          li.textContent = `Product ${id}: ${qty} units`;
          ul.appendChild(li);
        });
      });

      document.getElementById("load-report").onclick = async () => {
        const data = await (await fetch("/api/report")).json();
        document.getElementById("report").textContent = `Orders: ${data.orders}`;
      };

      document.getElementById("contact").onsubmit = (e) => {
        e.preventDefault();
        const email = new FormData(e.target).get("email");
        document.getElementById("contact-result").textContent = "Thank you, " + email + "!";
      };
    </script>
  </body>
</html>
