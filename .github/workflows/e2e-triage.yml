name: E2E + Jev triage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # Falhas de propósito da app de demonstração.
      FAKE_ENV_DOWN: "1"
      FLAKY_MAX_DELAY_MS: "2000"
      # Regras da triagem: configuráveis em Settings → Secrets and variables → Actions → Variables.
      TRIAGE_FAIL_ON: ${{ vars.TRIAGE_FAIL_ON || 'bug' }}
      TRIAGE_CONFIDENCE_THRESHOLD: ${{ vars.TRIAGE_CONFIDENCE_THRESHOLD || '0.6' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # continue-on-error: quem decide se o job falha é a triagem, não o número de testes vermelhos.
      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        run: npm test

      # ★ Aqui entra o Jev. Sem o secret, corre em fallback (unclassified) e não falha.
      - name: Triage failures with Jev
        if: always()
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: npm run triage

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload triage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-results
          path: |
            triage-output/
            test-results/results.json
          retention-days: 14
