name: E2E + Jev triage

on:
  push:
  pull_request:

permissions:
  contents: read

# Só um deploy do GitHub Pages de cada vez; um novo push não cancela o que está a publicar.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Uma suite a falhar não cancela a outra.
      fail-fast: false
      matrix:
        include:
          # local: a mini loja em app/. Publicada na raiz do Pages.
          - suite: local
            test_script: test
            site_path: ""
          # saucedemo: https://www.saucedemo.com. Publicada em /saucedemo/.
          - suite: saucedemo
            test_script: test:saucedemo
            site_path: saucedemo
    env:
      CI: "true"
      SUITE: ${{ matrix.suite }}
      # Falhas de propósito: app local (503 e atraso aleatório) e saucedemo (rede cortada num teste).
      FAKE_ENV_DOWN: "1"
      FLAKY_MAX_DELAY_MS: "2000"
      SAUCE_ENV_DOWN: "1"
      # Regras da triagem: configuráveis em Settings → Secrets and variables → Actions → Variables.
      TRIAGE_FAIL_ON: ${{ vars.TRIAGE_FAIL_ON || 'bug' }}
      TRIAGE_CONFIDENCE_THRESHOLD: ${{ vars.TRIAGE_CONFIDENCE_THRESHOLD || '0.6' }}
      TRIAGE_TEST_DEFECT_THRESHOLD: ${{ vars.TRIAGE_TEST_DEFECT_THRESHOLD || '0.7' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # continue-on-error: quem decide se o job falha é a triagem, não o número de testes vermelhos.
      - name: Run Playwright tests
        continue-on-error: true
        run: npm run ${{ matrix.test_script }}

      # Históricos das execuções anteriores, publicados no GitHub Pages pelo deploy anterior.
      # Na primeira execução (ou sem Pages) não existem, e tudo corre sem histórico.
      - name: Download history from GitHub Pages
        if: always()
        env:
          SITE_PATH: ${{ matrix.site_path }}
        run: |
          mkdir -p ".history/$SUITE"
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/${SITE_PATH:+$SITE_PATH/}"
          curl -fsSL "${base}history.json" -o ".history/$SUITE/triage.json" && echo "Histórico da triagem descarregado" || echo "Sem histórico da triagem"
          curl -fsSL "${base}allure-history.jsonl" -o ".history/$SUITE/allure.jsonl" && echo "Histórico do Allure descarregado" || echo "Sem histórico do Allure"

      # ★ Aqui entra o Jev. Sem o secret, corre em fallback (unclassified) e não falha.
      - name: Triage failures with Jev
        if: always()
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: npm run triage

      # Depois da triagem: os resultados Allure já trazem labels, descrição e anexo do Jev.
      - name: Generate Allure 3 report
        if: always()
        run: npm run allure

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.suite }}
          path: |
            reports/${{ matrix.suite }}/playwright-report/
            reports/${{ matrix.suite }}/allure-report/
            reports/${{ matrix.suite }}/triage/
            reports/${{ matrix.suite }}/results.json
          retention-days: 14

      # Parte desta suite no site do GitHub Pages (só em push para master; PRs não publicam).
      - name: Build Pages site
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          SITE_PATH: ${{ matrix.site_path }}
        run: |
          out="site/${SITE_PATH}"
          mkdir -p "$out"
          cp "reports/$SUITE/triage/index.html" "$out/index.html"
          cp "reports/$SUITE/triage/history.json" "$out/history.json"
          cp -r "reports/$SUITE/playwright-report" "$out/playwright-report"
          cp -r "reports/$SUITE/allure-report" "$out/allure"
          cp ".history/$SUITE/allure.jsonl" "$out/allure-history.jsonl" || true

      - name: Upload site part
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.suite }}
          path: site/
          retention-days: 1

  # Junta as partes das duas suites e publica. Corre mesmo quando o e2e falha por causa de
  # um bug: é precisamente aí que interessa ver os relatórios.
  deploy-pages:
    needs: e2e
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site parts
        uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: site
          merge-multiple: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
