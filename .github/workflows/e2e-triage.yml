name: E2E + Jev triage

on:
  push:
  pull_request:

permissions:
  contents: read

# Só um deploy do GitHub Pages de cada vez; um novo push não cancela o que está a publicar.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # Falhas de propósito da app de demonstração.
      FAKE_ENV_DOWN: "1"
      FLAKY_MAX_DELAY_MS: "2000"
      # Regras da triagem: configuráveis em Settings → Secrets and variables → Actions → Variables.
      TRIAGE_FAIL_ON: ${{ vars.TRIAGE_FAIL_ON || 'bug' }}
      TRIAGE_CONFIDENCE_THRESHOLD: ${{ vars.TRIAGE_CONFIDENCE_THRESHOLD || '0.6' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # continue-on-error: quem decide se o job falha é a triagem, não o número de testes vermelhos.
      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        run: npm test

      # Histórico das execuções anteriores: publicado no GitHub Pages pelo deploy anterior.
      # Na primeira execução (ou sem Pages) não existe, e a triagem corre sem histórico.
      # O mesmo vale para o histórico do Allure (trends e deteção de flaky do próprio Allure).
      - name: Download history from GitHub Pages
        if: always()
        run: |
          mkdir -p .triage-history .allure-history
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsSL "$base/history.json" -o .triage-history/history.json && echo "Histórico da triagem descarregado" || echo "Sem histórico da triagem"
          curl -fsSL "$base/allure-history.jsonl" -o .allure-history/history.jsonl && echo "Histórico do Allure descarregado" || echo "Sem histórico do Allure"

      # ★ Aqui entra o Jev. Sem o secret, corre em fallback (unclassified) e não falha.
      - name: Triage failures with Jev
        if: always()
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: npm run triage

      # Depois da triagem: os resultados Allure já trazem labels, descrição e anexo do Jev.
      - name: Generate Allure 3 report
        if: always()
        run: npm run allure

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload triage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-results
          path: |
            triage-output/
            test-results/results.json
          retention-days: 14

      # GitHub Pages: só em push para master (PRs não publicam).
      - name: Build Pages site
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p site
          cp triage-output/index.html site/index.html
          cp triage-output/history.json site/history.json
          cp -r allure-report site/allure
          cp .allure-history/history.jsonl site/allure-history.jsonl || true
          cp -r playwright-report site/playwright-report

      - name: Upload Pages artifact
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  # Publica a página mesmo quando o e2e falha por causa de um bug: é precisamente aí que interessa vê-la.
  deploy-pages:
    needs: e2e
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
